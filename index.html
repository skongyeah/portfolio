<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Ye Soobin — UX/UI Designer Portfolio">
<title>Ye Soobin — Portfolio</title>
<style>
:root{--bg:#eef2f4;--ink:#1e2a33;--line:#d8e0e5;--accent:#365d8f}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
.topbar{position:fixed;z-index:20;top:0;left:0;right:0;height:52px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:12px}
.brand{font-weight:700;letter-spacing:.04em}.meta{display:flex;align-items:center;gap:14px;color:#66747f}.progress{width:110px;height:3px;background:#e4e8eb;border-radius:10px;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
main{padding:78px 18px 50px}.pages{width:min(1440px,100%);margin:0 auto;display:flex;flex-direction:column;gap:18px}.page{position:relative;background:white;box-shadow:0 2px 14px rgba(30,42,51,.08);line-height:0;cursor:zoom-in}.prototype-link{position:absolute;left:39.5%;top:14.5%;width:22%;height:7%;z-index:10;cursor:pointer;background:transparent}.prototype-link:focus-visible{outline:2px solid #365d8f;outline-offset:2px;border-radius:2px}.page img{display:block;width:100%;height:auto}.page::after{content:attr(data-page);position:absolute;right:10px;bottom:8px;line-height:1;background:rgba(255,255,255,.82);padding:4px 6px;border-radius:4px;font-size:9px;color:#66747f;opacity:0;transition:opacity .2s}.page:hover::after{opacity:1}
.help{max-width:1440px;margin:18px auto 0;text-align:center;color:#77848d;font-size:11px;line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(12,18,23,.88);z-index:50;display:none;align-items:center;justify-content:center;padding:30px}.overlay.open{display:flex}.overlay img{max-width:96vw;max-height:92vh;width:auto;height:auto;object-fit:contain;box-shadow:0 10px 50px rgba(0,0,0,.4);cursor:zoom-out}.close{position:fixed;top:16px;right:20px;border:0;background:rgba(255,255,255,.12);color:white;width:40px;height:40px;border-radius:50%;font-size:24px;cursor:pointer}.nav{position:fixed;top:50%;transform:translateY(-50%);border:0;background:rgba(255,255,255,.12);color:white;width:44px;height:60px;border-radius:8px;font-size:30px;cursor:pointer}.prev{left:14px}.next{right:14px}
@media(max-width:700px){.topbar{height:46px;padding:0 12px}.meta{gap:8px}.progress{width:70px}main{padding:60px 0 24px}.pages{gap:8px}.page{box-shadow:0 1px 8px rgba(30,42,51,.08)}.page::after{display:none}.help{padding:0 16px}.overlay{padding:10px}.nav{width:36px;height:48px;font-size:24px}.prev{left:6px}.next{right:6px}}
</style>
</head>
<body>
<header class="topbar"><div class="brand">YE SOOBIN · PORTFOLIO</div><div class="meta"><span id="counter">01 / 44</span><span class="progress"><i id="bar"></i></span></div></header>
<main><div class="pages" id="pages"></div><div class="help">Click a page to enlarge · ESC to close · ← / → to move</div></main>
<div class="overlay" id="overlay" aria-hidden="true"><button class="close" aria-label="Close">×</button><button class="nav prev" aria-label="Previous">‹</button><img id="zoom" alt="Portfolio page"><button class="nav next" aria-label="Next">›</button></div>
<script>
const total=44, root='portfolio_pages/';
const pages=document.getElementById('pages');
for(let i=1;i<=total;i++){
 const n=String(i).padStart(2,'0');
 const el=document.createElement('section');el.className='page';el.dataset.page=`${n} / ${String(total).padStart(2,'0')}`;
 const img=document.createElement('img');img.loading=i===1?'eager':'lazy';img.alt=`Ye Soobin portfolio — page ${i}`;img.src=`${root}page-${n}.jpg`;
 el.appendChild(img);
 if(i===44){
   const link=document.createElement('a');
   link.className='prototype-link';
   link.href='https://www.figma.com/proto/w7A0vzs0sXjsA4fX8EJssl/TEDICT?node-id=1-64&t=OpUDC9W7r1mHjsFd-1&scaling=contain&content-scaling=fixed&page-id=0%3A1&starting-point-node-id=62%3A691';
   link.target='_blank';
   link.rel='noopener noreferrer';
   link.setAttribute('aria-label','Open TEDICT Prototype in Figma');
   link.title='TEDICT Prototype';
   link.addEventListener('click',e=>{e.stopPropagation();});
   el.appendChild(link);
 }
 el.addEventListener('click',(e)=>{if(e.target.closest('a')) return; openZoom(i)});pages.appendChild(el);
}
const overlay=document.getElementById('overlay'), zoom=document.getElementById('zoom'), counter=document.getElementById('counter'), bar=document.getElementById('bar');let current=1;
function update(i){current=Math.max(1,Math.min(total,i));const n=String(current).padStart(2,'0');zoom.src=`${root}page-${n}.jpg`;zoom.alt=`Ye Soobin portfolio — page ${current}`;counter.textContent=`${n} / ${String(total).padStart(2,'0')}`;bar.style.width=(current/total*100)+'%';}
function openZoom(i){update(i);overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.body.style.overflow='hidden'}
function closeZoom(){overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');document.body.style.overflow=''}
document.querySelector('.close').onclick=closeZoom;document.querySelector('.prev').onclick=()=>update(current-1);document.querySelector('.next').onclick=()=>update(current+1);overlay.addEventListener('click',e=>{if(e.target===overlay||e.target===zoom)closeZoom()});document.addEventListener('keydown',e=>{if(!overlay.classList.contains('open'))return;if(e.key==='Escape')closeZoom();if(e.key==='ArrowLeft')update(current-1);if(e.key==='ArrowRight')update(current+1)});
const io=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){const i=[...document.querySelectorAll('.page')].indexOf(e.target)+1;counter.textContent=`${String(i).padStart(2,'0')} / ${String(total).padStart(2,'0')}`;bar.style.width=(i/total*100)+'%'}})},{threshold:.45});document.querySelectorAll('.page').forEach(p=>io.observe(p));
</script>
</body></html>
